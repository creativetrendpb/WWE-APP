<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Sound Board</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #2d5a27 0%, #4a8b3a 45%, #87c76b 100%);
      padding: 2rem 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
      z-index: 2;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
      text-shadow: 0 4px 12px rgba(0, 40, 0, 0.5), 0 0 25px #d4ffb0;
      margin-bottom: 0.4rem;
    }

    header p {
      color: #eaffd9;
      font-size: 1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.9;
    }

    /* grid of animal cards */
    .sound-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1.4rem;
      max-width: 1100px;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .animal-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 26px;
      padding: 1.5rem 1rem 1.2rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.25s ease, border-color 0.2s;
      box-shadow: 0 10px 25px rgba(0, 30, 0, 0.3);
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .animal-card:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: #ffe066;
      box-shadow: 0 18px 35px rgba(0, 30, 0, 0.45), 0 0 25px rgba(255, 224, 102, 0.5);
    }

    .animal-card:active {
      transform: translateY(-2px) scale(0.98);
    }

    /* playing state */
    .animal-card.playing {
      animation: shake 0.5s ease;
      border-color: #ffe066;
      box-shadow: 0 0 35px #ffe066, 0 0 60px rgba(255, 224, 102, 0.6);
    }

    @keyframes shake {
      0%, 100% { transform: translateY(-8px) scale(1.03) rotate(0deg); }
      25% { transform: translateY(-8px) scale(1.03) rotate(-3deg); }
      75% { transform: translateY(-8px) scale(1.03) rotate(3deg); }
    }

    .animal-emoji {
      font-size: 3.6rem;
      line-height: 1;
      display: block;
      margin-bottom: 0.6rem;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
      transition: transform 0.2s;
    }

    .animal-card:hover .animal-emoji {
      transform: scale(1.15) rotate(-5deg);
    }

    .animal-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      margin-bottom: 0.3rem;
    }

    .animal-sound {
      font-size: 0.8rem;
      font-weight: 600;
      color: #eaffd9;
      font-style: italic;
      letter-spacing: 0.5px;
      opacity: 0.9;
    }

    /* small sound-wave indicator */
    .wave {
      display: inline-flex;
      gap: 3px;
      align-items: flex-end;
      height: 16px;
      margin-top: 0.6rem;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .animal-card.playing .wave,
    .animal-card:hover .wave {
      opacity: 1;
    }

    .wave span {
      width: 3px;
      background: #ffe066;
      border-radius: 3px;
      animation: wave 0.9s ease-in-out infinite;
    }

    .wave span:nth-child(1) { height: 6px; animation-delay: 0s; }
    .wave span:nth-child(2) { height: 14px; animation-delay: 0.15s; }
    .wave span:nth-child(3) { height: 9px; animation-delay: 0.3s; }
    .wave span:nth-child(4) { height: 16px; animation-delay: 0.45s; }
    .wave span:nth-child(5) { height: 7px; animation-delay: 0.6s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.3); }
    }

    /* footer hint */
    .hint {
      margin-top: 2.5rem;
      color: #eaffd9;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.85;
      text-align: center;
      position: relative;
      z-index: 2;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    /* floating leaves background */
    .leaf {
      position: fixed;
      font-size: 1.8rem;
      opacity: 0.18;
      animation: float 18s infinite linear;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes float {
      0%   { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-110vh) rotate(360deg); }
    }

    @media (max-width: 500px) {
      header h1 { font-size: 2rem; }
      header p { font-size: 0.8rem; letter-spacing: 2px; }
      .sound-grid { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1rem; }
      .animal-emoji { font-size: 2.8rem; }
      .animal-name { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <!-- floating decorative leaves -->
  <div class="leaf" style="left:5%; animation-duration:22s; animation-delay:0s;">🍃</div>
  <div class="leaf" style="left:25%; animation-duration:19s; animation-delay:4s;">🌿</div>
  <div class="leaf" style="left:55%; animation-duration:25s; animation-delay:2s;">🍂</div>
  <div class="leaf" style="left:80%; animation-duration:20s; animation-delay:6s;">🍃</div>
  <div class="leaf" style="left:92%; animation-duration:24s; animation-delay:3s;">🌿</div>

  <header>
    <h1>🐾 Animal Sound Board 🐾</h1>
    <p>Tap a card to hear the sound</p>
  </header>

  <div class="sound-grid" id="soundGrid">
    <!-- cards are generated by JavaScript -->
  </div>

  <div class="hint">🔊 Turn up your volume · Click &amp; listen!</div>

  <script>
    (function() {
      // ------------------------------------------------------------
      // Animal data: name, emoji, sound spelling, and speech synthesis
      // description + frequency/tone parameters for the fallback beep.
      // ------------------------------------------------------------
      const animals = [
        { name: "Dog",     emoji: "🐶", sound: "Woof! Woof!",       speak: "Woof woof",     freq: 380, type: "sine" },
        { name: "Cat",     emoji: "🐱", sound: "Meow!",             speak: "Meow",          freq: 620, type: "sine" },
        { name: "Cow",     emoji: "🐮", sound: "Moo!",              speak: "Moo",           freq: 180, type: "sine" },
        { name: "Pig",     emoji: "🐷", sound: "Oink! Oink!",       speak: "Oink oink",     freq: 340, type: "square" },
        { name: "Sheep",   emoji: "🐑", sound: "Baa!",              speak: "Baa",           freq: 440, type: "sine" },
        { name: "Horse",   emoji: "🐴", sound: "Neigh!",            speak: "Neigh",         freq: 300, type: "sawtooth" },
        { name: "Lion",    emoji: "🦁", sound: "Roar!",             speak: "Roar",          freq: 140, type: "sawtooth" },
        { name: "Tiger",   emoji: "🐯", sound: "Grrrrowl!",         speak: "Growl",         freq: 120, type: "sawtooth" },
        { name: "Elephant",emoji: "🐘", sound: "Paawooo!",          speak: "Pawoo",         freq: 100, type: "sine" },
        { name: "Monkey",  emoji: "🐵", sound: "Ooh ooh ah ah!",    speak: "Ooh ooh ah ah", freq: 700, type: "sine" },
        { name: "Wolf",    emoji: "🐺", sound: "Awoooooo!",         speak: "Awooo",         freq: 250, type: "sine" },
        { name: "Fox",     emoji: "🦊", sound: "Yip! Yip!",         speak: "Yip yip",       freq: 800, type: "sine" },
        { name: "Bear",    emoji: "🐻", sound: "Grrrr!",            speak: "Grrr",          freq: 110, type: "sawtooth" },
        { name: "Frog",    emoji: "🐸", sound: "Ribbit! Ribbit!",   speak: "Ribbit ribbit", freq: 500, type: "square" },
        { name: "Duck",    emoji: "🦆", sound: "Quack! Quack!",     speak: "Quack quack",   freq: 560, type: "square" },
        { name: "Chicken", emoji: "🐔", sound: "Cluck! Cluck!",     speak: "Cluck cluck",   freq: 680, type: "square" },
        { name: "Rooster", emoji: "🐓", sound: "Cock-a-doodle-doo!",speak:"Cock a doodle doo",freq:720,type:"sawtooth" },
        { name: "Bird",    emoji: "🐦", sound: "Tweet! Tweet!",     speak: "Tweet tweet",   freq: 900, type: "sine" },
        { name: "Owl",     emoji: "🦉", sound: "Hoot! Hoot!",       speak: "Hoot hoot",     freq: 350, type: "sine" },
        { name: "Bee",     emoji: "🐝", sound: "Bzzzzz!",           speak: "Buzz",          freq: 480, type: "sawtooth" },
        { name: "Snake",   emoji: "🐍", sound: "Hisssss!",          speak: "Hisss",         freq: 750, type: "sawtooth" },
        { name: "Mouse",   emoji: "🐭", sound: "Squeak! Squeak!",   speak: "Squeak squeak", freq: 950, type: "sine" },
        { name: "Rabbit",  emoji: "🐰", sound: "Thump! Thump!",     speak: "Thump",         freq: 200, type: "square" },
        { name: "Whale",   emoji: "🐳", sound: "Woooooo!",          speak: "Wooo",          freq: 80,  type: "sine" },
        { name: "Dolphin", emoji: "🐬", sound: "Eee-eee!",          speak: "Eee eee",       freq: 1100,type: "sine" },
        { name: "Penguin", emoji: "🐧", sound: "Squawk!",           speak: "Squawk",        freq: 600, type: "sawtooth" },
        { name: "Cricket", emoji: "🦗", sound: "Chirp! Chirp!",     speak: "Chirp chirp",   freq: 1000,type: "square" },
        { name: "Goat",    emoji: "🐐", sound: "Maaaaa!",           speak: "Maaa",          freq: 420, type: "sawtooth" }
      ];

      // ------------------------------------------------------------
      // Audio context for the fallback tone beep
      // ------------------------------------------------------------
      let audioCtx = null;

      function getAudioContext() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        return audioCtx;
      }

      // Play a short tone as a fallback "sound effect"
      function playTone(freq, type = "sine", duration = 0.35) {
        const ctx = getAudioContext();
        if (!ctx) return;

        // resume if suspended (browser autoplay policy)
        if (ctx.state === "suspended") ctx.resume();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        const now = ctx.currentTime;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.25, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.05);
      }

      // ------------------------------------------------------------
      // Speech synthesis: speak the animal sound aloud
      // ------------------------------------------------------------
      function speakSound(text) {
        if (!("speechSynthesis" in window)) return false;

        try {
          window.speechSynthesis.cancel(); // stop any ongoing speech

          const utter = new SpeechSynthesisUtterance(text);
          utter.rate = 0.9;      // slightly slower = clearer
          utter.pitch = 1.3;     // higher pitch = playful
          utter.volume = 1;
          utter.lang = "en-US";

          // pick an English voice if available
          const voices = window.speechSynthesis.getVoices();
          const enVoice = voices.find(v => v.lang && v.lang.startsWith("en"));
          if (enVoice) utter.voice = enVoice;

          window.speechSynthesis.speak(utter);
          return true;
        } catch (e) {
          return false;
        }
      }

      // ------------------------------------------------------------
      // Build the cards
      // ------------------------------------------------------------
      const grid = document.getElementById("soundGrid");

      animals.forEach(animal => {
        const card = document.createElement("div");
        card.className = "animal-card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", `${animal.name}: ${animal.sound}`);

        card.innerHTML = `
          <span class="animal-emoji">${animal.emoji}</span>
          <div class="animal-name">${animal.name}</div>
          <div class="animal-sound">"${animal.sound}"</div>
          <div class="wave">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        `;

        // play handler
        const playSound = () => {
          // visual feedback
          card.classList.add("playing");
          setTimeout(() => card.classList.remove("playing"), 700);

          // 1) Try speech synthesis first (real words, more fun)
          const spoke = speakSound(animal.speak);

          // 2) Always play a tone as the "sound effect" too,
          //    or as a fallback if speech isn't supported
          const freq = animal.freq;
          const type = animal.type;
          if (spoke) {
            // speech worked: play a quick supporting tone
            setTimeout(() => playTone(freq, type, 0.25), 120);
          } else {
            // no speech: play a longer tone so there's definitely audio
            playTone(freq, type, 0.5);
          }
        };

        card.addEventListener("click", playSound);

        // keyboard accessibility
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            playSound();
          }
        });

        grid.appendChild(card);
      });

      // ------------------------------------------------------------
      // Pre-load voices (some browsers load them async)
      // ------------------------------------------------------------
      if ("speechSynthesis" in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }

      // Unlock audio context on first user interaction (browser policy)
      document.body.addEventListener("click", () => {
        const ctx = getAudioContext();
        if (ctx && ctx.state === "suspended") ctx.resume();
      }, { once: true });

    })();
  </script>
</body>
</html>
